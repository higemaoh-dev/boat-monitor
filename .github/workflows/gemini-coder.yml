name: Generate Code with Gemini

on:
  issues:
    types: [opened, edited]

jobs:
  generate-code:
    # 'ai-coder' ラベルが付いた Issue のみ実行する（必要に応じて調整可）
    if: contains(github.event.issue.labels.*.name, 'ai-coder') || contains(github.event.issue.title, '[AI]')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Generate Code and Create PR
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python -c "
          import os
          import subprocess
          from google import genai

          # 1. Gemini API クライアント初期化
          api_key = os.environ.get('GEMINI_API_KEY')
          if not api_key:
              raise ValueError('GEMINI_API_KEY is not set in secrets.')

          client = genai.Client(api_key=api_key)

          # 2. モデルの指定 (最新モデルを設定)
          model_name = os.environ.get('GEMINI_MODEL', 'gemini-3.0-flash')

          # 3. プロンプト作成
          issue_title = os.environ.get('ISSUE_TITLE', '')
          issue_body = os.environ.get('ISSUE_BODY', '')
          prompt = f'''
          あなたは優秀なソフトウェアエンジニアです。
          以下のGitHub Issueの要望に基づいてコードを作成または修正してください。

          【タイトル】
          {issue_title}

          【詳細】
          {issue_body}

          回答はコードブロックのみ、または指定のファイル変更内容を出力してください。
          '''

          print(f'Using model: {model_name}')
          response = client.models.generate_content(
              model=model_name,
              contents=prompt,
          )

          print('--- Generated Response ---')
          print(response.text)

          # 必要に応じて、response.text を元にファイル出力や git 操作を行うスクリプトを追加
          "
