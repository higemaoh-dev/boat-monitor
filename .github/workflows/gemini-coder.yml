name: Generate Code with Gemini

on:
  issues:
    types: [opened, edited]

jobs:
  generate-code:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Generate Code and Create PR
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python -c "
          import os
          import re
          from google import genai

          # 1. API初期化
          api_key = os.environ.get('GEMINI_API_KEY')
          client = genai.Client(api_key=api_key)

          model_name = os.environ.get('GEMINI_MODEL', 'gemini-3.5-flash')
          issue_number = os.environ.get('ISSUE_NUMBER')
          issue_title = os.environ.get('ISSUE_TITLE', '')
          issue_body = os.environ.get('ISSUE_BODY', '')

          # 2. プロンプト
          prompt = f'''
          あなたは優秀なソフトウェアエンジニアです。
          以下のIssueの指示に従ってコードを作成または修正してください。

          【タイトル】: {issue_title}
          【内容】: {issue_body}

          回答は必ず修正後の完全なファイル内容だけを、以下の形式（コードブロック）で出力してください。
          \`\`\`python:generated_code.py
          # ここにコード
          \`\`\`
          '''

          print(f'Using model: {model_name}')
          response = client.models.generate_content(model=model_name, contents=prompt)
          res_text = response.text
          print('--- Gemini Output ---')
          print(res_text)

          # 3. エラーが起きない安全なコードブロック抽出ロジック
          pattern = r'```(?:[\w\.\-]+:)?([^\n]*)\n(.*?)```'
          matches = re.findall(pattern, res_text, re.DOTALL)

          if matches:
              header_filename, code_content = matches[0]
              # ヘッダーからファイル名を取得、無ければデフォルト名
              filename = header_filename.strip() if header_filename.strip() else 'generated_code.py'
              
              # ディレクトリが存在しない場合のケア（安全対策）
              dir_name = os.path.dirname(filename)
              if dir_name:
                  os.makedirs(dir_name, exist_ok=True)

              with open(filename, 'w', encoding='utf-8') as f:
                  f.write(code_content)
              print(f'Successfully updated: {filename}')
          else:
              print('No code block found in response.')
          "

      - name: Create Pull Request via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # Gitの設定
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 変更があるか確認
          if [ -n "$(git status --porcelain)" ]; then
            BRANCH_NAME="fix/issue-${ISSUE_NUMBER}"
            git checkout -b $BRANCH_NAME || git checkout $BRANCH_NAME
            git add .
            git commit -m "auto: fix for Issue #${ISSUE_NUMBER} - ${ISSUE_TITLE}"
            git push origin $BRANCH_NAME --force
            
            # PRの作成（既存のPRがなければ新規作成）
            gh pr create \
              --title "Fix Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
              --body "Closes #${ISSUE_NUMBER}\n\nGenerated automatically by Gemini." \
              --head $BRANCH_NAME \
              --base main || echo "PR already exists or created."
          else
            echo "No changes detected."
          fi
