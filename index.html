<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BOAT PFD MONITOR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cockpit-container">
    <!-- ヘッダー制御 -->
    <header>
      <div class="status-indicator">SYS OK</div>
      <h1>BOAT GLASS COCKPIT</h1>
      <button id="start-btn">ENGAGE INSTRUMENTS</button>
    </header>

    <!-- メイン計器エリア (コックピットディスプレイ) -->
    <main class="pfd-grid">
      <!-- 1. 中央：人工水平儀 (Attitude Indicator) -->
      <div class="pfd-card attitude-card">
        <div class="card-title">ATTITUDE / TILT</div>
        <canvas id="horizonCanvas"></canvas>
      </div>

      <!-- 2. 円形アナログ風タコメーター -->
      <div class="pfd-card gauge-card">
        <div class="card-title">ENGINE RPM</div>
        <canvas id="gaugeCanvas"></canvas>
        <div class="digital-readout" id="rpm-readout">0000 <span>RPM</span></div>
      </div>

      <!-- 3. デジタル数値・校正パネル -->
      <div class="pfd-card data-card">
        <div class="metric-box">
          <span class="m-label">SPEED (GPS)</span>
          <span class="m-value" id="speed-val">0.0</span>
          <span class="m-unit">KNOTS</span>
        </div>
        <div class="metric-box">
          <span class="m-label">YAW RATE</span>
          <span class="m-value" id="yaw-val">0</span>
          <span class="m-unit">DEG/S</span>
        </div>
        
        <!-- 校正コントロール -->
        <div class="calib-box">
          <label>CYLINDER / STROKE</label>
          <select id="stroke-cycles">
            <option value="1">4s2c / 2s1c (1P/R)</option>
            <option value="2">4s4c / 2s2c (2P/R)</option>
            <option value="3" selected>4s6c / 2s3c (3P/R)</option>
            <option value="4">4s8c (4P/R)</option>
          </select>
          <div class="slider-row">
            <span>SENS: <span id="calib-val">1.00</span></span>
            <input type="range" id="calib-multiplier" min="0.5" max="2.0" step="0.05" value="1.0">
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
